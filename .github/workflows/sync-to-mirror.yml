name: "Sync to mirror repo"
on:
  push:
    branches:
      - main
  workflow_dispatch: # Enable manual execution for troubleshooting
jobs:
  sync-to-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Should be executed on the dev repo.
    if: github.repository != 'plaidev/karte-expo-plugin'
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.SHARED_GITHUB_ACTION_AGENT_APP_ID }}
          private-key: ${{ secrets.SHARED_GITHUB_ACTION_AGENT_APP_PRIVATE_KEY }}
          owner: plaidev
          repositories: |
            karte-expo-plugin
          permission-contents: write
          permission-workflows: write
      - name: Checkout main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git
        run: |
          git config --global user.email "git@users.noreply.github.com"
          git config --global user.name "github actions"
      - name: Push to mirror repository
        run: |
          git remote add mirror https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/plaidev/karte-expo-plugin.git
          git pull mirror main --no-rebase --no-edit
          git push mirror main
      - name: Notify Slack on success
        if: success()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ✅ Successfully synced changes to mirror repo main branch
          SLACK_COLOR: success
      - name: Notify Slack on failure
        if: failure()
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ❌ Failed to sync changes to mirror repo
          SLACK_COLOR: failure
